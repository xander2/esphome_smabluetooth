substitutions:
  name: smablue-stream
  friendly_name: smablue-stream

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}


esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_BLUEDROID_ENABLED: "y"
      CONFIG_BT_CLASSIC_ENABLED: "y"
      CONFIG_BT_SPP_ENABLED: "y"
      CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY: "y"
      CONFIG_BT_BLE_ENABLED: "n"

external_components:
  - source:
      type: local
      path: ../components
    components: [smabluetooth_solar]
    refresh: 0sec
  # For production (after pushing to GitHub), replace the above with:
  # - source:
  #     type: git
  #     url: https://github.com/keerekeerweere/esphome_smabluetooth
  #   components: [smabluetooth_solar]
  #   refresh: 0sec

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption: 
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password 

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "espcustom Fallback Hotspot"
    password: !secret wifi_password


button:
  - platform: template
    name: "Sync Inverter Time"
    on_press:
      - lambda: 'id(sma_inverter).trigger_time_sync();'
  - platform: template
    name: "Fetch Inverter Time"
    on_press:
      - lambda: 'id(sma_inverter).trigger_time_fetch();'

time:
  - platform: homeassistant
    id: ha_time

sensor:
  # Read location from Home Assistant zone.home so latitude/longitude don't need
  # to be duplicated in this YAML. Values are pushed to the inverter component at
  # runtime whenever HA sends them (typically on connect and on zone change).
  - platform: homeassistant
    entity_id: zone.home
    attribute: latitude
    on_value:
      then:
        - lambda: 'id(sma_inverter).set_sma_inverter_latitude(x);'
  - platform: homeassistant
    entity_id: zone.home
    attribute: longitude
    on_value:
      then:
        - lambda: 'id(sma_inverter).set_sma_inverter_longitude(x);'

  - platform: smabluetooth_solar
    id: sma_inverter
    update_interval: 10s
    sma_inverter_bluetooth_mac: !secret sma_stream_bluetoothmac
    sma_inverter_password: !secret sma_stream_password
    sma_inverter_delay_values: 800ms

    # Margin after sunset before night mode engages (default 30min — extends sunset so readings drop to zero naturally)
    # sma_inverter_night_margin: 30min

    # Location for accurate sunrise/sunset. Without these, solar noon is assumed at 12:00 local time —
    # correct only at the timezone central meridian. Germany at 10°E in CEST (central meridian 30°E)
    # has solar noon at ~13:20 CEST, making night mode trigger ~1h early without these set.
    # Option A: read from Home Assistant (zone.home) — see sensor section below.
    # Option B: static decimal degrees (east/north positive):
    # sma_inverter_latitude:  52.0
    # sma_inverter_longitude: 7.0

    inverter_status: 
      name: "Inverter Status"

    grid_relay: 
      name: "Grid relay Status"

    phase_a:
      voltage:
          name: "Voltage Phase A"
      current:
          name: "Current Phase A"
      active_power:
          name: "Power Phase A"
    phase_b:
      voltage:
          name: "Voltage Phase B"
      current:
          name: "Current Phase B"
      active_power:
          name: "Power Phase B"
    phase_c:
      voltage:
          name: "Voltage Phase C"
      current:
          name: "Current Phase C"
      active_power:
          name: "Power Phase C"

    pv1:
      voltage:
          name: "Voltage mppt1"
      current:
          name: "Current mppt1"
      active_power:
          name: "Power mppt1"

    pv2:
      voltage:
          name: "Voltage mppt2"
      current:
          name: "Current mppt2"
      active_power:
          name: "Power mppt2"

#    active_power:
#      name: "Grid Active Power"

#    pv_active_power:
#      name: "PV Active Power"

    frequency:
      name: "Frequency"

    energy_production_day:
      name: "Today's Generation"

    total_energy_production:
      name: "Total Energy Production"

    total_operation_time:
      name: "Total Operation Time"

    total_feed_in_time:
      name: "Total Feed-In Time"

    wakeup_time:
      name: "Wakeup Time"

    serial_number:
      name: "Serial Number"

    software_version:
      name: "Software Version"

    device_type:
      name: "Device Type"

    device_class:
      name: "Device Class"

    inverter_module_temp:
      name: "Inverter Module Temp"

    sma_inverter_bluetooth_signal_strength:
      name: "Inverter Bluetooth Signal Strength"

    inverter_time:
      name: "Inverter Clock"